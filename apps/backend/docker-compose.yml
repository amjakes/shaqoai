services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shaqoai
      POSTGRES_USER: shaqoai
      POSTGRES_PASSWORD: shaqoai
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaqoai -d shaqoai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [.:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    command: celery -A src.worker.celery_app worker --loglevel=INFO
    volumes: [.:/app]
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres_data:
